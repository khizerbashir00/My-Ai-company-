# Local development services: PostgreSQL (app + test databases) and Redis.
# The API and web app run on your machine with `npm run dev:api` / `npm run dev:web`.
# Production deployment (containerized API/web behind a reverse proxy) is Phase 6.
#
#   docker compose up -d
#
# Credentials below are for local development only. Override them with a root-level .env file:
#   POSTGRES_USER, POSTGRES_PASSWORD

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ai_company
    ports:
      - '127.0.0.1:5432:5432' # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d ai_company']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
