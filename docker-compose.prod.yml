# Production-oriented stack. Secrets come from a gitignored env file — never bake them into images.
#
#   cp .env.production.example .env.production   # fill secrets locally
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See docs/deploy/production.md for DNS, TLS, backups, updates, and rollback.

name: ai-company-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_company}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
    # Not published to the host by default — only reachable from other containers.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_company}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Browser hits the public origin; nginx proxies /api same-origin. CORS list is a safety net.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${HQ_DOMAIN}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_MODEL_ADVANCED: ${OPENAI_MODEL_ADVANCED:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TASK_DEFAULT_MAX_ATTEMPTS: ${TASK_DEFAULT_MAX_ATTEMPTS:-3}
      SCAN_JOB_ATTEMPTS: ${SCAN_JOB_ATTEMPTS:-2}
      AI_DAILY_ESTIMATED_USD_BUDGET: ${AI_DAILY_ESTIMATED_USD_BUDGET:-}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-1}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health/ready']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    stop_grace_period: 20s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      HQ_DOMAIN: ${HQ_DOMAIN:?set HQ_DOMAIN e.g. hq.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata_prod:
  redisdata_prod:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
